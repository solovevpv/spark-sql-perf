# Tuning candidates for a TPC-DS query run at SF1000 on 4 x 20 CPU x 40 GB,
# reading Parquet from MinIO over s3a.
#
#   TUNING_CONF=tuning-sf1000.conf ./run-tpcds-bench.sh
#
# Applied after the script's own settings, so anything here wins.
#
# Measured on the first SF1000 attempt (97 of 118 queries before the executor
# failure cap stopped it): CPU was 40% of executor run time, GC 0.6%, mean
# parallelism 40 of 64 slots. So this cluster is not GC-bound and no longer
# purely I/O-bound at this scale factor.
#
# Defaults are named in the comments. Change one group at a time and compare
# medians per query against the baseline run — a tuning file applied wholesale
# tells you the total but not which setting earned it.
#
# Executor shape is NOT here: it lives in EXECUTORS / EXECUTOR_CORES /
# EXECUTOR_MEMORY / EXECUTOR_OVERHEAD, because those size the pods rather than
# configure the engine.

# --- S3 read path ------------------------------------------------------------
# The smoke run spent 75-84% of task time off-CPU, so this is where the money
# is. Hadoop here is 3.3.4, which is why the fadvise key still carries the
# "experimental" prefix; a newer Hadoop renames it.
#
# Parquet reads columns, which means seeking inside the object. Under the
# default "normal" policy the stream starts sequential and only switches to
# random after a backward seek, aborting and reopening the HTTP connection to
# get there. "random" issues ranged GETs from the start.
spark.hadoop.fs.s3a.experimental.input.fadvise=random

# Minimum size of each ranged GET (default 64K). Too small and a column chunk
# costs several round trips; too large and the tail of each range is wasted.
spark.hadoop.fs.s3a.readahead.range=256K

# Connection pool and worker threads (defaults 96 and 10). Ten threads is the
# one that surprises people: it is shared by the whole filesystem instance in
# an executor, so it throttles concurrent opens well before the pool does.
spark.hadoop.fs.s3a.connection.maximum=200
spark.hadoop.fs.s3a.threads.max=64
spark.hadoop.fs.s3a.max.total.tasks=64

# Bigger read splits (default 128m). Fewer, longer tasks amortise the per-object
# latency, which at SF1 was most of the run. At SF1000 CPU was already 40% of
# executor time, so the gain is smaller here; 256m held up in the first run
# without any loss on the read-heavy queries, so it stays.
spark.sql.files.maxPartitionBytes=256m

# --- Memory ------------------------------------------------------------------
# Nothing is cached in this workload, so give execution the storage half.
# Defaults are 0.6 and 0.5.
spark.memory.fraction=0.7
spark.memory.storageFraction=0.1

# --- Joins -------------------------------------------------------------------
# TPC-DS is a snowflake: most joins attach a dimension to a fact, and the
# dimensions are small enough to broadcast if the threshold allows it (default
# 10m). The estimate Spark compares against is the compressed on-disk size, so
# the in-memory copy is several times larger — raise the driver's result cap
# with it (default 1g).
spark.sql.autoBroadcastJoinThreshold=64m
spark.driver.maxResultSize=4g

# --- Shuffle -----------------------------------------------------------------
# Write buffer, default 32k.
spark.shuffle.file.buffer=1m

# The fetch window stays at its 48m default, and the number of concurrent
# fetches is capped, which it is not by default (both are unbounded).
#
# This is where the first SF1000 run died: 32 executors killed with exit 137
# over two hours, no java.lang.OutOfMemoryError anywhere and GC at 0.6% of
# executor time. The heap was never the problem -- the container was. Shuffle
# fetch buffers are direct memory, outside the heap, and they come out of
# spark.executor.memoryOverhead. With an unbounded number of in-flight requests
# per reduce task they can grow past it, and the kernel kills the pod.
#
# Every loss was on a join-heavy query (q16, q65, q24*, q72, q50, q23*). The two
# most read-dominated queries in the run, q9 and q28, lost none -- which is why
# the S3 settings above stay as they are and these come down.
spark.reducer.maxSizeInFlight=48m
spark.reducer.maxReqsInFlight=256
spark.reducer.maxBlocksInFlightPerAddress=256

# Make the JVM enforce its own direct-memory ceiling. Without it an overrun is
# a SIGKILL with no Java-side trace; with it the task fails, is retried, and the
# log says what happened.
spark.executor.extraJavaOptions=-XX:MaxDirectMemorySize=1g

# The default cap on cumulative executor failures is 2 x spark.executor.instances
# -- 32 here -- which suits a job of minutes, not a three-hour benchmark where a
# handful of transient losses is survivable. Raise it, but only alongside fixing
# the cause: on its own it just makes a doomed run take longer to fail.
spark.executor.maxNumFailures=200

# A busy cluster loses the occasional fetch; retrying is cheaper than failing a
# stage an hour into the run. Defaults 3 and 5s.
spark.shuffle.io.maxRetries=10
spark.shuffle.io.retryWait=10s

# Left at the 64m default. Doubling it doubles the data each reduce task holds,
# and after the first SF1000 run that is not a bet worth taking until the
# executors are stable. Try 128m again once a full run completes.
spark.sql.adaptive.advisoryPartitionSizeInBytes=64m

# TPC-DS has genuinely skewed keys; this is on by default but worth pinning,
# because a single setting turning it off costs whole queries.
spark.sql.adaptive.skewJoin.enabled=true

# --- Measurement hygiene -----------------------------------------------------
# Speculation would improve wall-clock time on stragglers by running duplicate
# work, which is exactly what a benchmark must not do to its own numbers.
spark.speculation=false

# 118 queries produce a large event log; compressing it costs nothing here.
spark.eventLog.compress=true
